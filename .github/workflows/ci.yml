name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: verify
        run: make verify

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build production image
        run: docker build -t artifacts:ci .
      - name: Verify production image
        run: python3 scripts/verify-container.py --image artifacts:ci --evidence /tmp/artifacts-container-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-evidence
          path: /tmp/artifacts-container-evidence
