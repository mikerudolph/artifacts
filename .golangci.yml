version: "2"

linters:
  default: standard
  enable:
    - cyclop
    - dupl
    - errcheck
    - funlen
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - maintidx
    - nestif
    - revive
    - staticcheck
    - unparam
  settings:
    cyclop:
      max-complexity: 15
    dupl:
      threshold: 200
    funlen:
      lines: 70
      statements: 50
      ignore-comments: true
    gocyclo:
      min-complexity: 15
    maintidx:
      under: 20
    nestif:
      min-complexity: 4
    revive:
      rules:
        - name: argument-limit
          arguments: [6]
        - name: exported
          disabled: true
  exclusions:
    generated: lax

formatters:
  enable:
    - gofmt
    - goimports
