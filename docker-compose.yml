services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: artifacts
      POSTGRES_PASSWORD: artifacts
      POSTGRES_DB: artifacts
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artifacts"]
      interval: 2s
      timeout: 5s
      retries: 20

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: artifacts
      MINIO_ROOT_PASSWORD: artifacts-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  minio-data:
