<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Artifacts — Versioned files for your applications.</title>
  <desc id="description">Create repositories, publish through REST or Git, and retrieve an exact version. A blue stack of snapshots sits beside the headline on a dark background.</desc>
  <defs>
    <radialGradient id="atmosphere"><stop stop-color="#7aa2f7" stop-opacity=".18"/><stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/></radialGradient>
    <linearGradient id="surface" x2="1" y2="1"><stop stop-color="#7dcfff" stop-opacity=".2"/><stop offset="1" stop-color="#7aa2f7" stop-opacity=".04"/></linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#0c111d"/>
  <ellipse cx="955" cy="330" rx="370" ry="310" fill="url(#atmosphere)"/>
  <g fill="#7dcfff" transform="translate(64 51)">
    <path d="m0 22 18 10 18-10v9L18 41 0 31z" opacity=".36"/>
    <path d="m0 11 18 10 18-10v9L18 30 0 20z" opacity=".65"/>
    <path d="m18-5 18 10-18 10L0 5z"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
