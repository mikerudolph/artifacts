    <g font-size="68" font-weight="600" letter-spacing="-2">
      <text x="60" y="225" fill="#e8edfc">Versioned files.</text>
      <text x="60" y="307" fill="#7dcfff">For your</text>
      <text x="60" y="389" fill="#7dcfff">applications.</text>
    </g>
    <g fill="#a9b5ce" font-size="26">
      <text x="64" y="475">Publish through REST or Git.</text>
      <text x="64" y="516">Retrieve an exact version.</text>
    </g>
  </g>
  <g fill="none" stroke="#7dcfff" stroke-opacity=".18">
